<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sounds Of Downtown Festival 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#ececec;
}

/* HEADER */
.header{
    width:100%;
}

.header img{
    width:100%;
    display:block;
}

/* CONTENT */
.container{
    max-width:900px;
    margin:auto;
    padding:30px 15px 50px;
}

/* LOGO */
.brand{
    margin-bottom:25px;
}

.brand img{
    height:45px;
}

/* CARD */
.event-card{
    background:#fff;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 4px 20px rgba(0,0,0,.08);
}

.poster{
    width:100%;
    display:block;
}

.card-body{
    padding:28px;
}

.title-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
}

.event-title{
    font-size:24px;
    font-weight:800;
    color:#111;
    line-height:1.3;
}

.snk{
    color:#2196f3;
    text-decoration:none;
    font-weight:700;
    font-size:18px;
    cursor:pointer;
}

.info{
    margin-top:20px;
}

.info-item{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:14px;
    color:#777;
    font-size:18px;
}

.icon{
    width:26px;
    text-align:center;
}

/* BUTTON */
.buy-btn{
    width:100%;
    margin-top:25px;
    border:none;
    background:#ffc533;
    color:#111;
    font-size:24px;
    font-weight:800;
    padding:22px;
    border-radius:16px;
    cursor:pointer;
    transition:.3s;
}

.buy-btn:hover{
    transform:translateY(-2px);
}

@media(max-width:768px){

    .event-title{
        font-size:20px;
    }

    .info-item{
        font-size:16px;
    }

    .buy-btn{
        font-size:20px;
        padding:18px;
    }

    .card-body{
        padding:22px;
    }
}
</style>
</head>
<body>

<!-- BANNER -->
<div class="header">
    <img src="banner-livin.png" alt="Banner Sounds Of Downtown Festival">
</div>

<div class="container">

    <!-- LOGO -->
    <div class="brand">
        <img src="logo.png" alt="Logo Event">
    </div>

    <!-- EVENT CARD -->
    <div class="event-card">

        <!-- POSTER -->
        <img src="poster-livin.png" alt="Poster Event" class="poster">

        <div class="card-body">

            <div class="title-row">
                <h2 class="event-title">
                    SOUNDS OF DOWNTOWN FESTIVAL 2026
                </h2>

                <a href="#" class="snk">S&amp;K</a>
            </div>

            <div class="info">

                <div class="info-item">
                    <span class="icon">🕒</span>
                    <span>1 &amp; 2 Agustus 2026</span>
                </div>

                <div class="info-item">
                    <span class="icon">📍</span>
                    <span>Surabaya</span>
                </div>

            </div>

            <button
                class="buy-btn"
                onclick="window.location.href='https://ticketonline2026.github.io/ADDITIONAL-TIKET/'">
                Beli Tiket
            </button>

        </div>

    </div>

</div>

</body>
</html>
